name = "forge-fc-publisher"
main = "worker.js"
compatibility_date = "2026-10-01"

# Create a KV namespace and replace the id below.
[[kv_namespaces]]
binding = "SESSIONS"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

[vars]
GITHUB_OWNER = "YOUR_GITHUB_USERNAME_OR_ORG"
GITHUB_REPO = "my-club-website"
GITHUB_BRANCH = "main"
# Exact public admin URL; no trailing slash. Example:
ADMIN_ORIGIN = "https://YOUR_USERNAME.github.io/my-club-website/admin.html"
# Exact origin of the GitHub Pages site, no path. Example:
PUBLIC_ORIGIN = "https://YOUR_USERNAME.github.io"
# GitHub usernames allowed to sign in, comma-separated:
STAFF_LOGINS = "your-github-login,another-staff-login"
